# Copy this file to target_companies.yaml (gitignored -- personal values
# only). Curated list of companies for src/sourcing/py_poll_ats_boards.py
# to poll via their public Greenhouse/Lever/Ashby ATS APIs -- no scraping,
# no auth, just each board's own public JSON endpoint.
#
# Find a company's token from its careers page URL:
#   Greenhouse: boards.greenhouse.io/<token>
#   Lever:      jobs.lever.co/<token>
#   Ashby:      jobs.ashbyhq.com/<token>
#
# auto_submit controls src/submission/py_submit_application.py, not the
# poller -- set to true only once you trust a company's ATS form well
# enough to let a fully-passing Definition-of-Done gate submit for you
# unattended. Every company starts false; flip it on deliberately, one
# at a time. false still gets you discovery + tailoring + review, you
# just submit that one by hand at the end.
#
# The lists below are the same placeholder companies that were already
# hardcoded in src/sourcing/ats_boards.py (salvaged from an earlier
# project) -- replace them with your own actual target list.

